name = "rompfortherescues"
compatibility_date = "2024-09-23"
pages_build_output_dir = "public"
compatibility_flags = [ "nodejs_compat" ]

[[r2_buckets]]
binding = "SLIDESHOW_BUCKET"
bucket_name = "slideshowpictures"

[[r2_buckets]]
binding = "EVENT_PICTURES_BUCKET"
