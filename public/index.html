<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon – Romp for the Rescues</title>
  <meta name="description" content="Romp for the Rescues – fun events that raise funds for animal charities. Save the date: February 6, 2027.">
  <link rel="icon" href="images/logo.jpg">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="page">
    <header>
      <img
        class="card"
        src="images/banners.png"
        alt="Romp for the Rescues – fun events that raise funds for animal charities"
      >
      <p class="eyebrow">Coming Soon</p>
      <p class="tagline">Fun events that raise funds for animal charities.</p>
    </header>

    <section class="card">
      <p class="kicker">Save the Date</p>
      <h1>February 6, 2027</h1>
      <p class="place">Lake Worth Beach, Florida</p>
      <div class="countdown" id="countdown" aria-live="polite">
        <div class="unit"><span id="days">0</span><label>Days</label></div>
        <div class="unit"><span id="hours">0</span><label>Hours</label></div>
        <div class="unit"><span id="minutes">0</span><label>Minutes</label></div>
        <div class="unit"><span id="seconds">0</span><label>Seconds</label></div>
      </div>
    </section>

    <section class="card band">
      <img class="band-photo" src="images/Band.png" alt="F'NESS band – Save the Date">
      <div>
        <p class="kicker">Live Music</p>
        <h2>F'NESS</h2>
        <p class="when">7–10 PM at the Bamboo Room</p>
      </div>
    </section>

    <footer>
      <p>&copy; <span id="year"></span> Romp for the Rescues. Supporting animal charities through fun events.</p>
      <p>Contact: <a href="mailto:hello@RompfortheRescues.org">hello@RompfortheRescues.org</a></p>
    </footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
